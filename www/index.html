<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Life Sim</title><style>
body{font-family:Georgia,serif;background:#f3efe6;color:#23201b;max-width:480px;margin:0 auto;padding:16px}
.card{background:#fffdf8;border:1px solid #ddd5c4;border-radius:10px;padding:14px;margin-bottom:12px}
.age{font-size:44px;font-weight:bold}
.bar{height:8px;background:#ddd5c4;border-radius:4px;margin:3px 0 8px}
.bar i{display:block;height:100%;background:#2f6f5e;border-radius:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
button{font:inherit;font-size:16px;padding:14px;border-radius:10px;border:1px solid #ddd5c4;background:#fffdf8;color:#23201b}
.main{grid-column:1/-1;background:#2f6f5e;color:#fff;font-weight:bold}
input{font:inherit;width:100%;padding:12px;margin:10px 0;box-sizing:border-box}
#log{max-height:260px;overflow-y:auto}
#log p{margin:0 0 8px;border-bottom:1px solid #ddd5c4;padding-bottom:6px}
#log p.bad{color:#b3402e}
#dec{border:2px solid #2f6f5e}
.pc{border:1px solid #ddd5c4;border-radius:8px;padding:8px;margin-bottom:8px}
.pc.on{border:2px solid #2f6f5e}
.row{display:flex;justify-content:space-between}
small{color:#6f685c}
.hide{display:none}
</style></head><body>
<div id="start" class="card"><h1>Life Sim</h1>
<input id="name" placeholder="Name your character">
<button class="main" style="width:100%" onclick="newLife()">Start life</button>
<button id="cont" class="hide" style="width:100%;margin-top:8px" onclick="cont()">Continue saved life</button></div>

<div id="game" class="hide">
<div class="card"><div class="age" id="age"></div><div id="who"></div>
<div id="en" style="margin:6px 0"></div>
Health<div class="bar"><i id="hb"></i></div>
Happy<div class="bar"><i id="pb"></i></div>
Smarts<div class="bar"><i id="sb"></i></div>
<div id="stat"></div></div>

<div id="dec" class="card hide"><p id="dq"></p>
<div class="grid" style="margin:0"><button id="da" onclick="choose('a')"></button><button id="db" onclick="choose('b')"></button></div></div>

<div id="main">
<div class="grid">
<button class="main" onclick="act(ageUp)">Age up</button>
<button onclick="act(study)">Study</button>
<button onclick="act(gym)">Exercise</button>
<button id="bjob" onclick="act(job)">Find job</button>
<button id="bwork" class="hide" onclick="act(work)">Work hard</button>
<button onclick="act(fun)">Have fun</button>
<button id="love" onclick="act(love)">Find love</button>
<button onclick="act(crime)">Crime</button>
<button id="kid" class="hide" onclick="act(kid)">Have a child</button>
<button id="uni" class="hide" onclick="act(enroll)">University</button></div>
<div class="card"><b>People</b><div id="ppl" style="margin-top:8px"></div>
<div id="pa" class="grid hide" style="margin:0">
<button onclick="act(()=>pa('talk'))">Talk</button>
<button onclick="act(()=>pa('gift'))">Gift $50</button>
<button class="main" onclick="act(()=>pa('fight'))">Fight</button></div></div>
</div>

<div class="card"><div id="log"></div></div></div>

<div id="over" class="card hide"><h2 id="ot"></h2><p id="ox"></p><p id="oa"></p>
<button id="nx" class="main" style="width:100%"></button></div>

<script>
const J=0;
const NM=["Sam","Ali","Zara","Noor","Omar","Mia","Leo","Hana","Ravi","Lina","Tariq","Eva"];
const TR={lucky:"Lucky",lazy:"Lazy",genius:"Genius",risky:"Risk-taker"};
const TD={lucky:"better odds on risks",lazy:"only 2 actions a year",genius:"you learn faster",risky:"crime works more often"};
const TITLES=["Intern","Associate","Senior","Manager","Director"];
const PAY=[15000,28000,45000,70000,110000];
let p,pend=null,pers=null;
const $=i=>document.getElementById(i);
const cl=v=>Math.max(0,Math.min(100,v));
const r=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const m$=n=>(n<0?"-":"")+"$"+Math.abs(n).toLocaleString();
const mk=(role,emoji,rel)=>({name:NM[r(0,NM.length-1)],role,emoji,rel});
const ch=role=>p.chars.find(c=>c.role===role);
const has=role=>!!ch(role);
const nm=role=>ch(role).name;
const rel=(role,d)=>{const c=ch(role);if(c)c.rel=cl(c.rel+d)};
const maxEn=()=>p.trait==="lazy"?2:3;
function log(t,bad){const e=document.createElement("p");if(bad)e.className="bad";e.innerHTML=t;$("log").prepend(e)}
function save(){try{localStorage.setItem("ls3",JSON.stringify(p))}catch(e){}}
function wipe(){try{localStorage.removeItem("ls3")}catch(e){}}
function bad(){try{return JSON.parse(localStorage.getItem("ls_badges")||"[]")}catch(e){return[]}}
function unlock(id,label){const b=bad();if(b.includes(id))return;b.push(id);try{localStorage.setItem("ls_badges",JSON.stringify(b))}catch(e){}log("🏆 Achievement: "+label)}
const BD=[["grad","High school graduate",()=>p.grad],["deg","University graduate",()=>p.degree],["wed","Got married",()=>p.love==="married"],["par","Became a parent",()=>p.kids>0],["rich","Rich ($100,000)",()=>p.money>=100000],["dir","Became Director",()=>p.job&&p.lvl===4],["jail","Jailbird (3 arrests)",()=>p.crimes>=3],["bff","Best friend (95+)",()=>has("Friend")&&ch("Friend").rel>=95],["old","Lived to 80",()=>p.age>=80]];
function badges(){BD.forEach(b=>{if(b[2]())unlock(b[0],b[1])})}
function use(){if(p.en<=0){log("No energy left this year. Age up.",1);return false}p.en--;return true}

function render(){
if(!ch(pers))pers=null;
$("age").textContent="Age "+p.age;
const st=p.love==="married"?"married":p.love==="dating"?"dating":"single";
$("who").textContent=p.name+" · "+TR[p.trait]+" · "+st+(p.kids?" · "+p.kids+" kid"+(p.kids>1?"s":""):"")+(p.gen>1?" · Gen "+p.gen:"");
$("en").textContent="Energy "+"●".repeat(p.en)+"○".repeat(maxEn()-p.en);
$("hb").style.width=p.health+"%";$("pb").style.width=p.happy+"%";$("sb").style.width=p.smart+"%";
const w=p.uni>0?"University ("+p.uni+" yr left)":p.grade>0?"Grade "+p.grade:p.job?TITLES[p.lvl]+" ("+m$(PAY[p.lvl])+"/yr) perf "+p.perf+"/60":p.grad?"Graduate, no job":"Not in school";
$("stat").textContent=m$(p.money)+" | "+w;
$("love").textContent=p.love==="none"?"Find love":p.love==="dating"?"Propose":"Date night";
$("bjob").classList.toggle("hide",p.job||p.age<18);
$("bwork").classList.toggle("hide",!p.job);
$("kid").classList.toggle("hide",!(p.love==="married"&&p.age>=22));
$("uni").classList.toggle("hide",!(p.grad&&!p.degree&&p.uni===0&&p.age<=26&&p.smart>=40));
$("ppl").innerHTML=p.chars.map(c=>'<div class="pc'+(pers===c.role?" on":"")+'" onclick="sel(\''+c.role+'\')"><div class="row"><span>'+c.emoji+" "+c.name+" <small>"+c.role+'</small></span><span>'+c.rel+'</span></div><div class="bar"><i style="width:'+c.rel+'%"></i></div></div>').join("");
$("pa").classList.toggle("hide",!pers)}
function sel(role){pers=pers===role?null:role;render()}
function show(){$("start").classList.add("hide");$("game").classList.remove("hide");$("main").classList.remove("hide");render()}

function newLife(){const T=Object.keys(TR);
p={name:$("name").value||"Alex",age:0,gen:1,health:100,happy:70,smart:r(30,80),money:0,trait:T[r(0,3)],en:0,job:false,lvl:0,perf:0,love:"none",kids:0,crimes:0,grade:0,grad:false,uni:0,degree:false,studied:0,owed:null,sick:false,everJob:false,chars:[mk("Mom","👩",70),mk("Dad","👨",70),mk("Sibling","🧒",60)]};
p.en=maxEn();$("log").innerHTML="";
log("<b>"+p.name+"</b> was born. Trait: "+TR[p.trait]+" ("+TD[p.trait]+").");
log("Your parents are "+nm("Mom")+" and "+nm("Dad")+". Your sibling is "+nm("Sibling")+".");
show();save()}
function cont(){try{p=JSON.parse(localStorage.getItem("ls3"));pers=null;$("log").innerHTML="";log("Welcome back, "+p.name+".");show()}catch(e){}}
function nextGen(){const d=p,T=Object.keys(TR);
p={name:NM[r(0,NM.length-1)],age:18,gen:d.gen+1,health:100,happy:70,smart:cl(Math.round(d.smart/2)+r(20,45)),money:Math.max(0,Math.round(d.money/2)),trait:T[r(0,3)],en:0,job:false,lvl:0,perf:0,love:"none",kids:0,crimes:0,grade:0,grad:true,uni:0,degree:false,studied:0,owed:null,sick:false,everJob:false,chars:[mk("Mom","👩",70),mk("Dad","👨",70),mk("Friend","🧑",50)]};
p.en=maxEn();pers=null;$("over").classList.add("hide");$("log").innerHTML="";
log("Gen "+p.gen+": <b>"+p.name+"</b>, age 18, inherited "+m$(p.money)+". Trait: "+TR[p.trait]+".");
show();save()}

function ageUp(){p.age++;p.en=maxEn();let m="Age "+p.age+".";
if(p.job){p.money+=PAY[p.lvl];p.everJob=true;
p.perf+=r(-10,6)+Math.round((ch("Boss").rel-50)/10);
if(p.perf>=60){if(p.lvl<4){p.lvl++;p.perf=30;m+=" Promoted to "+TITLES[p.lvl]+"!"}else p.perf=60}
else if(p.perf<=0){p.job=false;p.perf=0;p.chars=p.chars.filter(c=>c.role!=="Boss");p.happy=cl(p.happy-15);m+=" You were fired!"}}
if(p.kids)p.money-=p.kids*500;
if(p.age===6){p.grade=1;p.chars.push(mk("Friend","🧑",50));m+=" You started school and met "+nm("Friend")+"."}
else if(p.grade>=1){const s=p.smart+p.studied*6+r(-20,20)+(p.trait==="genius"?10:0);
if(s>=45){p.grade++;if(p.grade>12){p.grade=0;p.grad=true;m+=" You graduated high school!"}else m+=" Passed grade "+(p.grade-1)+"."}
else{p.happy=cl(p.happy-8);m+=" You failed the year and repeat grade "+p.grade+"."}}
if(p.uni>0){p.money-=3000;const s=p.smart+p.studied*6+r(-20,20)+(p.trait==="genius"?10:0);
if(s>=55){p.uni--;if(p.uni===0){p.degree=true;m+=" You graduated university!"}else m+=" Passed a university year."}
else{p.happy=cl(p.happy-8);m+=" You failed a university exam and repeat the year."}}
p.studied=0;
p.health=cl(p.health-r(0,2)-Math.floor(p.age/30));
if(p.health<40&&Math.random()<.4)p.sick=true;
if(p.love!=="none"){p.happy=cl(p.happy+2);rel("Partner",r(-6,3));
if(Math.random()<(p.love==="dating"?0.1:0.03)){breakup("Your relationship ended.")}}
if(p.owed&&p.age>=p.owed.age){if(has("Friend")&&ch("Friend").rel>=50){p.money+=p.owed.amt;rel("Friend",10);m+=" "+nm("Friend")+" paid you back $"+p.owed.amt+"."}else{m+=" "+(has("Friend")?nm("Friend"):"Your friend")+" never paid you back."}p.owed=null}
if(Math.random()<.45){const E=[["You found $50!",0,5,50],["You caught the flu.",-10,-5,0],["Great day outside.",5,5,0],["You broke your arm.",-15,-5,-200],["You got a bonus.",0,6,500],["Your phone got stolen.",0,-8,-250],["You won a small lottery.",0,10,300]];
const e=E[r(0,E.length-1)];p.health=cl(p.health+e[1]);p.happy=cl(p.happy+e[2]);p.money+=e[3];m+=" "+e[0]}
log(m)}
function study(){if(!use())return;p.smart=cl(p.smart+(p.age<18?7:4)+(p.trait==="genius"?3:0));p.studied++;p.happy=cl(p.happy-3);log("You studied hard.")}
function gym(){if(!use())return;p.health=cl(p.health+6);log("You worked out.")}
function fun(){if(!use())return;p.happy=cl(p.happy+7);p.money-=20;log("Fun day. -$20")}
function work(){if(!use())return;p.perf+=12;p.happy=cl(p.happy-2);log("You worked extra hard.")}
function job(){if(p.age<18)return log("Too young to work.",1);if(p.job)return log("You already have a job.",1);if(!use())return;
if(Math.random()<.5+p.smart/200){p.job=true;p.lvl=p.degree?1:0;p.perf=30;p.everJob=true;p.chars.push(mk("Boss","🧑‍💼",50));log("You got a job: <b>"+TITLES[p.lvl]+"</b>. Your boss is "+nm("Boss")+".")}else log("No offers this time.",1)}
function enroll(){if(!use())return;p.uni=4;log("You enrolled in university. It costs $3,000 a year (loans allowed).")}
function breakup(t){p.love="none";p.chars=p.chars.filter(c=>c.role!=="Partner");p.happy=cl(p.happy-20);log(t+" Breakup.",1)}
function love(){if(p.age<16)return log("Too young for love.",1);
if(p.love==="dating"&&p.age<20)return log("Too young to marry.",1);if(!use())return;
if(p.love==="none"){if(Math.random()<.3+p.happy/200){p.love="dating";p.chars.push(mk("Partner","❤️",60));p.happy=cl(p.happy+10);log("You started dating <b>"+nm("Partner")+"</b>!")}else{p.happy=cl(p.happy-3);log("No luck finding love.",1)}}
else if(p.love==="dating"){if(Math.random()<.4+ch("Partner").rel/200){p.love="married";p.happy=cl(p.happy+15);p.money-=2000;log("You married "+nm("Partner")+"! Wedding cost $2,000.")}else breakup(nm("Partner")+" said no.")}
else{p.happy=cl(p.happy+8);p.money-=100;rel("Partner",8);log("Date night. -$100")}}
function kid(){if(!use())return;p.kids++;p.happy=cl(p.happy+10);p.money-=1000;log("A baby is born! Kids cost $500 a year each.")}
function crime(){if(p.age<14)return log("Too young for crime.",1);if(!use())return;
const ch2=.5+(p.trait==="lucky"?.05:0)+(p.trait==="risky"?.15:0);
if(Math.random()<ch2){const g=r(200,2000);p.money+=g;p.happy=cl(p.happy-5);log("The crime worked. +"+m$(g))}
else{p.crimes++;if(p.job){p.job=false;p.perf=0;p.chars=p.chars.filter(c=>c.role!=="Boss")}p.happy=cl(p.happy-20);p.health=cl(p.health-10);rel("Mom",-10);rel("Dad",-10);log("You got caught! Jailed, lost your job, and your parents are disappointed.",1)}}
function pa(t){const c=ch(pers);if(!c||!use())return;
if(t==="talk"){c.rel=cl(c.rel+r(3,8));p.happy=cl(p.happy+2);log("You talked with "+c.name+".")}
else if(t==="gift"){p.money-=50;c.rel=cl(c.rel+r(8,15));log("You gave "+c.name+" a gift. -$50")}
else{c.rel=cl(c.rel-r(10,20));p.happy=cl(p.happy-3);log("You fought with "+c.name+".",1)}}

const HOSP={q:"You are seriously ill. Pay $800 for treatment?",a:["Pay $800",()=>{p.money-=800;p.health=cl(p.health+30);return"Treatment worked. -$800"}],b:["Tough it out",()=>{p.health=cl(p.health-15);return"You got worse."}]};
const EV=[
{ok:()=>has("Friend")&&!p.owed,q:()=>nm("Friend")+" asks to borrow $300.",a:["Lend $300",()=>{p.money-=300;rel("Friend",15);p.owed={age:p.age+2,amt:300};return"You lent $300. "+nm("Friend")+" is grateful."}],b:["Refuse",()=>{rel("Friend",-15);return nm("Friend")+" is upset with you."}]},
{ok:()=>has("Mom"),q:()=>nm("Mom")+" wants you to visit.",a:["Visit",()=>{rel("Mom",10);p.happy=cl(p.happy+5);return"A lovely visit."}],b:["Skip",()=>{rel("Mom",-10);return nm("Mom")+" feels ignored."}]},
{ok:()=>has("Dad"),q:()=>nm("Dad")+" offers you $200 if you do chores.",a:["Do chores",()=>{p.money+=200;p.happy=cl(p.happy-3);rel("Dad",6);return"+$200"}],b:["No thanks",()=>{rel("Dad",-4);return"Dad shrugs."}]},
{ok:()=>p.job&&has("Boss"),q:()=>nm("Boss")+" asks you to work overtime.",a:["Accept",()=>{p.perf+=15;p.health=cl(p.health-8);rel("Boss",8);return"You impressed "+nm("Boss")+"."}],b:["Decline",()=>{p.perf-=5;rel("Boss",-8);return nm("Boss")+" is annoyed."}]},
{ok:()=>has("Partner"),q:()=>"You and "+nm("Partner")+" had an argument.",a:["Apologize",()=>{rel("Partner",8);return"You made peace."}],b:["Stand your ground",()=>{rel("Partner",-15);p.happy=cl(p.happy-5);return"It got tense."}]},
{ok:()=>has("Sibling"),q:()=>nm("Sibling")+" asks for your help.",a:["Help",()=>{rel("Sibling",10);p.happy=cl(p.happy+3);return"You helped out."}],b:["Ignore",()=>{rel("Sibling",-10);return"They got angry."}]},
{ok:()=>true,q:()=>"A stranger offers a risky $500 investment.",a:["Invest",()=>{if(Math.random()<(p.trait==="lucky"?.65:.5)){p.money+=1000;return"It paid off! +$1,000"}p.money-=500;return"You lost $500."}],b:["Say no",()=>"You played it safe."]},
{ok:()=>true,q:()=>"You find a wallet with $400.",a:["Keep it",()=>{p.money+=400;p.happy=cl(p.happy-4);return"You kept it. +$400"}],b:["Return it",()=>{p.happy=cl(p.happy+8);return"You returned it. Feels good."}]}];

function maybeDecision(){
if(p.sick){p.sick=false;pend=HOSP}
else if(p.age>=8&&Math.random()<.35){const l=EV.filter(e=>e.ok());const e=l[r(0,l.length-1)];pend={q:e.q(),a:e.a,b:e.b}}
else return;
$("dq").textContent=pend.q;$("da").textContent=pend.a[0];$("db").textContent=pend.b[0];
$("dec").classList.remove("hide");$("main").classList.add("hide")}
function choose(k){const o=pend[k];log(o[1]());pend=null;
$("dec").classList.add("hide");$("main").classList.remove("hide");
partnerCheck();badges();render();if(!checkEnd(false))save()}
function partnerCheck(){if(has("Partner")&&ch("Partner").rel<=0)breakup("Your relationship fell apart.")}
function checkEnd(roll){
const dead=p.health<=0||(roll&&p.age>=70&&Math.random()<(p.age-70)/50);
if(!dead)return false;
if(!p.everJob)unlock("nowork","Never worked");
wipe();$("game").classList.add("hide");$("over").classList.remove("hide");
const t=p.money>=300000?"died rich":p.money<0?"died in debt":"lived a simple life";
$("ot").textContent=p.name+" "+t+" at "+p.age;
$("ox").textContent="Money: "+m$(p.money)+" | Kids: "+p.kids+" | Crimes: "+p.crimes+" | Smarts: "+p.smart+" | Generation: "+p.gen;
$("oa").textContent="🏆 Achievements unlocked: "+bad().length+"/10";
$("nx").textContent=p.kids?"Continue as your child (gets half your money)":"Live again";
$("nx").onclick=p.kids?nextGen:()=>location.reload();
return true}
function act(f){f();partnerCheck();badges();render();if(checkEnd(f===ageUp))return;if(f===ageUp)maybeDecision();save()}
try{if(localStorage.getItem("ls3"))$("cont").classList.remove("hide")}catch(e){}
</script></body></html>
